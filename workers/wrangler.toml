name = "ntfy-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Assets directory for static files (Pages-style deployment)
assets = { directory = "./dist", binding = "ASSETS" }

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ntfy"
database_id = "dba6c366-04c0-4a9d-8d22-22e854021df2"

# Durable Objects
[durable_objects]
bindings = [
  { name = "TOPIC_DO", class_name = "TopicDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["TopicDO"]

# Environment variables
[vars]
DEFAULT_MESSAGE_EXPIRY = "43200"
MAX_MESSAGE_SIZE = "4096"
KEEPALIVE_INTERVAL = "45"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Note: Set these secrets via `wrangler secret put`:
# - JWT_SECRET: Secret key for signing JWT tokens
