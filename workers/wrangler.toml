name = "ntfy-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
logpush = true

# Assets directory for static files (Pages-style deployment)
# run_worker_first = true ensures worker handles ALL requests, including PUT/POST to /
# Worker manually fetches from ASSETS binding for static files
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ntfy"
database_id = "dba6c366-04c0-4a9d-8d22-22e854021df2"

# Durable Objects
[durable_objects]
bindings = [
  { name = "TOPIC_DO", class_name = "TopicDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["TopicDO"]

# Scheduled triggers (cron)
[triggers]
crons = ["0 * * * *"]  # Run every hour to clean up expired messages

# Environment variables (NTFY_ prefix for consistency with upstream ntfy)
[vars]
NTFY_CACHE_DURATION = "43200"        # 12 hours in seconds
NTFY_MESSAGE_SIZE_LIMIT = "4096"     # 4KB
NTFY_KEEPALIVE_INTERVAL = "45"       # seconds
# Config toggles for UI
NTFY_ENABLE_LOGIN = "true"
NTFY_ENABLE_SIGNUP = "false"
NTFY_AUTH_DEFAULT_ACCESS = "read-write"  # or "deny-all" to require login
NTFY_ENABLE_RESERVATIONS = "true"
# Upstream configuration for iOS push notifications
NTFY_BASE_URL = "https://ntfy.kclj.io"
NTFY_UPSTREAM_BASE_URL = "https://ntfy.sh"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Note: Set these secrets via `wrangler secret put`:
# - JWT_SECRET: Secret key for signing JWT tokens
# - NTFY_UPSTREAM_ACCESS_TOKEN: (optional) Access token for ntfy.sh rate limit exemption
